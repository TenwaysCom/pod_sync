<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}POD 同步控制台{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token or '' }}">
  <link rel="icon" href="{{ request.url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}?v={{ static_version|default('20260603') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand-block">
        <div class="brand-copy">
          <p class="eyebrow eyebrow-inverse">TENWAYS POD 运维台</p>
          <h1>POD 同步控制台</h1>
        </div>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav class="nav" aria-label="主导航">
      <div class="nav-primary">
        <a class="{% if page_id == 'overview' %}active{% endif %}" {% if page_id == 'overview' %}aria-current="page"{% endif %} href="{{ request.url_for('overview') }}">工作台</a>
        <a class="{% if page_id == 'phase1a' %}active{% endif %}" {% if page_id == 'phase1a' %}aria-current="page"{% endif %} href="{{ request.url_for('phase1a_page') }}">识别结果</a>
        <a class="{% if page_id == 'odoo_push' %}active{% endif %}" {% if page_id == 'odoo_push' %}aria-current="page"{% endif %} href="{{ request.url_for('odoo_push_page') }}">Odoo 推送</a>
        <a class="{% if page_id == 'reconcile' %}active{% endif %}" {% if page_id == 'reconcile' %}aria-current="page"{% endif %} href="{{ request.url_for('reconcile_page') }}">总结对账</a>
        <a class="{% if page_id == 'jobs' %}active{% endif %}" {% if page_id == 'jobs' %}aria-current="page"{% endif %} href="{{ request.url_for('jobs_page') }}">任务中心</a>
      </div>
      <div class="nav-utility">
        <details class="nav-tools" {% if page_id in ['sync', 'files', 'scheduler', 'report', 'odoo_missing', 'compare'] %}data-active="true"{% endif %}>
          <summary>工具</summary>
          <div class="nav-tools-menu">
            <a class="{% if page_id == 'sync' %}active{% endif %}" {% if page_id == 'sync' %}aria-current="page"{% endif %} href="{{ request.url_for('sync_page') }}">同步与巡检</a>
            <a class="{% if page_id == 'files' %}active{% endif %}" {% if page_id == 'files' %}aria-current="page"{% endif %} href="{{ request.url_for('files_page') }}">文件</a>
            <a class="{% if page_id == 'scheduler' %}active{% endif %}" {% if page_id == 'scheduler' %}aria-current="page"{% endif %} href="{{ request.url_for('scheduler_page') }}">定时任务</a>
            <a class="{% if page_id in ['report', 'odoo_missing', 'compare'] %}active{% endif %}" {% if page_id in ['report', 'odoo_missing', 'compare'] %}aria-current="page"{% endif %} href="{{ request.url_for('report_page') }}">详细报告</a>
            <form method="post" action="{{ request.url_for('logout') }}" class="nav-tools-logout">
              <button type="submit" class="ghost-button">退出</button>
            </form>
          </div>
        </details>
      </div>
    </nav>

    <div id="flashStack" class="flash-stack" role="status" aria-live="polite" aria-atomic="true">
      {% if flash.notice %}
        <div class="flash flash-ok" data-flash kind="notice">
          <span>{{ flash.notice }}</span>
          <button type="button" class="flash-close" data-flash-close aria-label="关闭提示">关闭</button>
        </div>
      {% endif %}
      {% if flash.error %}
        <div class="flash flash-error" data-flash data-flash-persistent kind="error" role="alert">
          <span>{{ flash.error }}</span>
          <button type="button" class="flash-close" data-flash-close aria-label="关闭提示">关闭</button>
        </div>
      {% endif %}
    </div>

    <main id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    (() => {
      const csrfToken = document.querySelector("meta[name='csrf-token']")?.getAttribute("content") || "";
      if (csrfToken) {
        document.querySelectorAll("form[method='post'], form[method='POST']").forEach((form) => {
          if (form.querySelector("input[name='csrf_token']")) return;
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = "csrf_token";
          input.value = csrfToken;
          form.appendChild(input);
        });

        const nativeFetch = window.fetch.bind(window);
        window.fetch = (input, init = {}) => {
          const nextInit = { ...init };
          const headers = new Headers(nextInit.headers || {});
          if (!headers.has("x-csrf-token")) {
            headers.set("x-csrf-token", csrfToken);
          }
          nextInit.headers = headers;
          return nativeFetch(input, nextInit);
        };
      }

      const flashStack = document.getElementById("flashStack");

      const primaryNav = document.querySelector(".nav-primary");
      const activePrimaryNav = primaryNav?.querySelector('[aria-current="page"]');
      if (primaryNav && activePrimaryNav) {
        const centerActivePrimaryNav = () => {
          if (primaryNav.scrollWidth <= primaryNav.clientWidth) return;
          const navRect = primaryNav.getBoundingClientRect();
          const activeRect = activePrimaryNav.getBoundingClientRect();
          const activeCenter = (
            activeRect.left - navRect.left + primaryNav.scrollLeft + (activeRect.width / 2)
          );
          primaryNav.scrollLeft = Math.max(0, activeCenter - (navRect.width / 2));
        };
        centerActivePrimaryNav();
        window.addEventListener("load", () => {
          window.requestAnimationFrame(centerActivePrimaryNav);
        }, { once: true });
      }

      function dismissFlash(node) {
        if (!node) return;
        node.classList.add("is-hiding");
        window.setTimeout(() => {
          node.remove();
          if (flashStack && !flashStack.children.length) {
            flashStack.classList.remove("has-flash");
          }
        }, 220);
      }

      function createFlash(message, kind = "notice") {
        if (!flashStack) return null;
        const flash = document.createElement("div");
        flash.className = `flash ${kind === "error" ? "flash-error" : "flash-ok"}`;
        flash.setAttribute("data-flash", "");
        if (kind === "error") {
          flash.setAttribute("data-flash-persistent", "");
          flash.setAttribute("role", "alert");
        }
        flash.innerHTML = `<span></span><button type="button" class="flash-close" data-flash-close aria-label="关闭提示">关闭</button>`;
        flash.querySelector("span").textContent = message;
        flash.querySelector("[data-flash-close]")?.addEventListener("click", () => dismissFlash(flash));
        flashStack.appendChild(flash);
        flashStack.classList.add("has-flash");
        if (kind !== "error") {
          window.setTimeout(() => dismissFlash(flash), 3200);
        }
        return flash;
      }

      const url = new URL(window.location.href);
      if (url.searchParams.has("notice") || url.searchParams.has("error")) {
        url.searchParams.delete("notice");
        url.searchParams.delete("error");
        window.history.replaceState({}, "", `${url.pathname}${url.search}${url.hash}`);
      }

      const flashes = Array.from(document.querySelectorAll("[data-flash]"));
      if (flashes.length && flashStack) {
        flashStack.classList.add("has-flash");
      }
      flashes.forEach((flash) => {
        flash.querySelector("[data-flash-close]")?.addEventListener("click", () => dismissFlash(flash));
        if (!flash.hasAttribute("data-flash-persistent")) {
          window.setTimeout(() => dismissFlash(flash), 3200);
        }
      });

      document.querySelectorAll("form[data-submit-state]").forEach((form) => {
        form.addEventListener("submit", () => {
          const submitButton = form.querySelector("button[type='submit'], input[type='submit']");
          if (!submitButton || submitButton.disabled) return;
          const loadingText = submitButton.getAttribute("data-loading-text");
          const pendingNotice = form.getAttribute("data-pending-notice");
          const originalText = submitButton.tagName === "INPUT" ? submitButton.value : submitButton.textContent;
          submitButton.dataset.originalText = originalText || "";
          submitButton.disabled = true;
          submitButton.classList.add("is-loading");
          if (loadingText) {
            if (submitButton.tagName === "INPUT") {
              submitButton.value = loadingText;
            } else {
              submitButton.textContent = loadingText;
            }
          }
          if (pendingNotice) {
            createFlash(pendingNotice, "notice");
          }
        });
      });
    })();
  </script>
</body>
</html>
